services:
  - type: web
    name: jobhunt-backend-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install --include=dev && npm run render:build
    startCommand: npm run start
    healthCheckPath: /api/v1/health
    envVars:
      - key: PORT
        value: 8080
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: ACCESS_TOKEN_EXPIRY
        value: 15m
      - key: REFRESH_TOKEN_EXPIRY
        value: 30d
      - key: EMAIL_PROVIDER
        value: brevo
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: singhshiva8454@gmail.com
      - key: EMAIL_FROM_NAME
        value: JobHunt
      - key: RESEND_API_KEY
        sync: false
