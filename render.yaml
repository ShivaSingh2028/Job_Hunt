services:
  - type: web
    name: jobhunt-backend-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run render:build
    startCommand: npm run start
    envVars:
      - key: PORT
        value: 8080
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        value: jobhunt_super_secure_jwt_secret_key_2026
      - key: JWT_REFRESH_SECRET
        value: jobhunt_super_secure_refresh_secret_key_2026
      - key: ACCESS_TOKEN_EXPIRY
        value: 15m
      - key: REFRESH_TOKEN_EXPIRY
        value: 30d
      - key: EMAIL_PROVIDER
        value: smtp
      - key: RESEND_API_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SMTP_SECURE
        value: false
